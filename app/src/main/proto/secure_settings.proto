syntax = "proto3";
package edgepulse;
option java_package = "com.edgepulse.monitor.proto";
option java_multiple_files = true;

message CloudModelProto {
  string id = 1;
  string name = 2;
  int32 image_support = 3;
  int64 context_tokens = 4;
}

message ProviderCredentialProto {
  string provider = 1;
  bytes api_key = 2;
  string validation_endpoint = 3;
  string model = 4;
  bool validated = 5;
  int64 validated_wall_ms = 6;
  repeated CloudModelProto models = 7;
  int64 models_fetched_wall_ms = 8;
}

message SecureSettingsProto {
  reserved 1, 2;
  bytes sql_cipher_passphrase = 3;
  string trusted_audit_public_key = 4;
  string active_session_id = 5;
  int64 last_heartbeat_elapsed_ms = 6;
  int64 last_heartbeat_wall_ms = 7;
  string boot_id = 8;
  string benchmark_cache = 9;
  repeated ProviderCredentialProto credentials = 10;
  string checkpoint_tree_uri = 11;
  string attestation_nonce_mode = 12;
  bytes verifier_challenge_sha256 = 13;
  string last_checkpoint_status = 14;
  int64 last_checkpoint_wall_ms = 15;
  string active_cloud_provider = 16;
  string item_profiles_json = 17;
  string selected_item_id = 18;
  string api_usage_json = 19;
}

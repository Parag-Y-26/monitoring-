# Verified against Google Maven / Maven Central on 2026-10-29.
# Evidence and rejected newer releases: docs/dependency-resolution.json.
# DataStore 1.3.0: user-approved exception to the 14-day cooling period.
# CameraX 1.6.1: explicit user pin, ahead of the general latest-stable rule.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
coroutines = "1.11.0"
serialization = "1.11.0"
compose-bom = "2026.09.00"
activity = "1.13.0"
core = "1.19.1"
